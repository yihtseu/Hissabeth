name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    rust:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Fetch optical project test fixtures
              uses: actions/checkout@v7
              with:
                  repository: heterophyllus/Geopter
                  ref: 0edfbf52fcf0e3fc660e5ae33c354fd7a6be80d7
                  path: reference/upstream
                  sparse-checkout: example
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: Test Rust library
              run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib
            - name: Test headless bench script
              run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --test batch_script
            - uses: oven-sh/setup-bun@v2
            - name: Build desktop assets
              run: |
                  bun install --frozen-lockfile
                  bun run build
            - name: Install Tauri Linux system libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev
            - name: Check desktop application
              run: cargo check --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol

    mcp:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: Build the headless broker and relay
              run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --bin hissabeth --target-dir src-tauri/target
            - name: Test MCP transport and workspace recovery
              run: |
                  python3 src-tauri/tests/mcp_transport.py
                  python3 src-tauri/tests/mcp_transport.py --workspace-recovery
            - name: Test malformed tool arguments and batch rollback
              run: |
                  cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --test mcp_fuzz --target-dir src-tauri/target
                  python3 src-tauri/tests/mcp_transport.py --malformed-parameters

    oracle:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Fetch Geopter prescriptions
              uses: actions/checkout@v7
              with:
                  repository: heterophyllus/Geopter
                  ref: 0edfbf52fcf0e3fc660e5ae33c354fd7a6be80d7
                  path: reference/upstream
                  sparse-checkout: |
                      example
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: Run reference cases in-process and through the headless CLI
              run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --test oracle oracle_ -- --include-ignored --nocapture

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run format:check
            - run: bun run build
