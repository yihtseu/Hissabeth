[package]
name = "hissabeth"
version = "0.1.0"
description = "Agent-controlled optical design workbench"
license = "GPL-3.0-or-later"
authors = ["Yizhou Tong <yizhou.tong@outlook.com>"]
edition = "2024"

[lib]
name = "hissabeth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-store", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
schemars = "1.2"
getrandom = "0.4"
libc = "0.2"
tempfile = "3"
same-file = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Blueprint PNG and vector PDF from the millimetre SVG; svg2pdf 0.13 and resvg
# 0.45 share usvg 0.45. Text is converted with the system fonts.
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
tauri-plugin-store = { version = "2.5", optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }
tauri-plugin-fs = { version = "2.7", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
